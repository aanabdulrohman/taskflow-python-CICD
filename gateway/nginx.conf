events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Frontend (Static Files di dalam Container)
        location / {
            root /usr/share/nginx/html; # 🚀 DIUBAH: Path standar di dalam container Nginx
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Reverse Proxy ke Python FastAPI Backend
        location /api/ {
            proxy_pass http://backend-service:8000; # 🚀 DIUBAH: Menggunakan nama service Docker Compose
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Forward dokumentasi Swagger OpenAPI
        location /docs {
            proxy_pass http://backend-service:8000/docs; # 🚀 DIUBAH: Menggunakan nama service Docker Compose
        }
        location /openapi.json {
            proxy_pass http://backend-service:8000/openapi.json; # 🚀 DIUBAH: Menggunakan nama service Docker Compose
        }
    }
}
