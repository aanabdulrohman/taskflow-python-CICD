<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Microservice</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        .form-group { margin-bottom: 15px; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 16px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        ul { list-style-type: none; padding: 0; }
        li { background: #f4f4f4; margin: 8px 0; padding: 10px; border-left: 4px solid #007bff; }
    </style>
</head>
<body>
    <h1>TaskFlow Manager</h1>

    <div class="form-group">
        <h3>Tambah Tugas Baru</h3>
        <input type="text" id="title" placeholder="Judul tugas..." required><br><br>
        <textarea id="description" placeholder="Deskripsi tugas..."></textarea><br><br>
        <button onclick="createTask()">Simpan Task</button>
    </div>

    <hr>

    <h3>Daftar Tugas</h3>
    <ul id="taskList"></ul>

    <script src="app.js"></script>
</body>
</html>
