name: TaskFlow Tag-Based CI/CD Pipeline

on:
  push:
    tags:
      - '*.*.*'

jobs:
  # -------------------------------------------------------------
  # JOB 1: Unit Testing
  # -------------------------------------------------------------
  test:
    name: Run Pytest Unit Tests
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Run Tests
        run: |
          cd backend
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pytest

  # -------------------------------------------------------------
  # JOB 2: Security Scanning dengan Trivy
  # -------------------------------------------------------------
  security-scan:
    name: Trivy Vulnerability Scan
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag Name
        id: vars
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build Backend Docker Image for Scanning
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:${{ env.TAG_NAME }} ./backend

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:${{ env.TAG_NAME }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # -------------------------------------------------------------
  # JOB 3: Build, Push ke Docker Hub, & Deploy
  # -------------------------------------------------------------
  deploy:
    name: Build, Push & Deploy via Docker Compose
    needs: security-scan
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Runtime .env File
        run: |
          # 1. Inject isi ENV_FILE (khusus env service)
          echo "${{ secrets.ENV_FILE }}" > .env
          
          # 2. Inject variabel platform secara dinamis dari GitHub Secrets & Tag
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
          echo "IMAGE_TAG=${TAG_NAME}" >> .env

      - name: Stop Local MySQL Service if running
        run: |
          sudo systemctl stop mysql || true

      - name: Deploy with Docker Compose
        run: |
          docker-compose down
          docker-compose up --build -d