name: TaskFlow Tag-Based CI/CD Pipeline

on:
  push:
    tags:
      - '*.*.*'

jobs:
  security-scan:
    name: Trivy Vulnerability Scan
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag Name
        id: vars
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build Backend Docker Image for Scanning
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:${{ env.TAG_NAME }} ./backend

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:${{ env.TAG_NAME }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  deploy:
    name: Build, Push & Deploy via Production Docker Compose
    needs: security-scan
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Runtime .env File
        run: |
          # 1. Inject isi ENV_FILE (khusus env service)
          echo "${{ secrets.ENV_FILE }}" > .env
          
          # 2. Inject variabel platform secara dinamis dari GitHub Secrets & Tag
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
          echo "IMAGE_TAG=${TAG_NAME}" >> .env

      - name: Deploy with Production Docker Compose
        run: |
          docker-compose -f docker compose.prod.yaml down
          docker-compose -f docker compose.prod.yaml up -d